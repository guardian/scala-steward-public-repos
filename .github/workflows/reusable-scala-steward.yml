name: Reusable Scala Steward workflow

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      app_installation_id:
        required: true
        type: string
    secrets:
      private_key:
        required: true

permissions:
  contents: read

jobs:
  scala-steward:
    name: scala-steward
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller's repo to obtain list of repos
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: caller-repo

      - name: Checkout public repo to obtain config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: guardian/scala-steward-public-repos
          path: public-repo

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Generate REPOSITORIES.md from app installations
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fetch all repos where the GitHub App is installed
          all_repos=$(gh api --paginate /installation/repositories \
            --jq '.repositories[] | "- " + .full_name' | sort)

          # Exclude repos already covered by a specific *-repositories.md config
          excluded_repos=$(cat caller-repo/*-repositories.md)

          # Write all_repos minus the ones in excluded_repos to repos-using-default-config.md
          echo "$all_repos" \
            | grep -vxFf <(echo "$excluded_repos") \
            > repos-using-default-config.md

      - name: Execute Scala Steward (DevX)
        uses: scala-steward-org/scala-steward-action@ff09222640622d474d0d9f93c04aefedd125b187 # v2.92.0
        with:
          github-app-id: ${{ inputs.app_id }}
          github-app-installation-id: ${{ inputs.app_installation_id }}
          github-app-key: ${{ secrets.private_key }}
          github-app-auth-only: true
          repos-file: caller-repo/devx-repositories.md
          repo-config: public-repo/devx-scala-steward.conf
          other-args: "--add-labels"

      - name: Execute Scala Steward
        uses: scala-steward-org/scala-steward-action@ff09222640622d474d0d9f93c04aefedd125b187 # v2.92.0
        with:
          github-app-id: ${{ inputs.app_id }}
          github-app-installation-id: ${{ inputs.app_installation_id }}
          github-app-key: ${{ secrets.private_key }}
          github-app-auth-only: true
          repos-file: repos-using-default-config.md
          repo-config: public-repo/scala-steward.conf
          other-args: "--add-labels"